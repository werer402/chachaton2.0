[client]
showErrorDetails = true
toolbarMode = "minimal"

[logger]
level = "info"

[theme]
primaryColor = "#FF6B35"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"

[server]
port = 8501
headless = true
enableXsrfProtection = false
enableCORS = false

# Мобильная оптимизация
[browser]
gatherUsageStats = false
